name: Build site branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binaries and publish to site-build branch
        run: |
          mkdir -p /tmp/_site
          cp index.html /tmp/_site/
          base64 -d assets.tgz.b64 | tar xzf - -C /tmp/_site
          touch /tmp/_site/.nojekyll
          cd /tmp/_site
          git init -q -b site-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build site"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-build
